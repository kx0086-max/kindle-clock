<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kindle 时钟与番茄钟</title>
    <style>
        /* 基础重置 */
        html, body {
            margin: 0; padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* 必须隐藏滚动条 */
            user-select: none;
        }

        /* 主容器 */
        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 核心修改：强制横屏的精确算法 */
        /* 这里去掉了对 body 类的依赖，默认直接生效，或者通过 js 控制 */
        body.force-landscape #app {
            width: 100vh; 
            height: 100vw;
            position: absolute;
            top: 100vh;
            left: 0;
            transform-origin: top left;
            -webkit-transform-origin: top left;
            transform: rotate(-90deg);
            -webkit-transform: rotate(-90deg);
        }

        /* === 上半部分：显示区域 === */
        #display-area {
            flex: 8;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .view {
            display: none;
            width: 100%; height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .view.active { display: flex; }

        /* 时钟样式 */
        #time {
            font-size: 35vmin; 
            font-weight: bold;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        #date {
            font-size: 6vmin;
            color: #888;
            margin-top: 2vh;
        }

        /* 番茄钟样式 */
        #pomo-timer {
            font-size: 25vmin;
            font-weight: bold;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            margin-bottom: 2vh;
        }

        .pomo-settings {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 3vh;
        }
        .set-btn {
            background: #000; color: #fff;
            border: 3px solid #fff;
            font-size: 8vmin; width: 15vmin; height: 15vmin;
            border-radius: 50%; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
        }
        .set-btn:active { background: #fff; color: #000; }
        #set-mins { font-size: 8vmin; font-weight: bold; width: 20vmin; text-align: center; }

        .pomo-controls { display: flex; gap: 30px; }
        .ctrl-btn {
            background: #000; color: #fff;
            border: 3px solid #fff;
            padding: 10px 40px; font-size: 6vmin;
            border-radius: 12px; font-weight: bold;
        }
        .ctrl-btn:active { background: #fff; color: #000; }

        /* === 下半部分：导航区域 === */
        #nav-area {
            flex: 2;
            display: flex;
            border-top: 3px solid #333;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6vmin;
            font-weight: bold;
            cursor: pointer;
            background: #000; color: #fff;
        }
        .nav-btn.active {
            background: #fff; color: #000;
        }
        .nav-btn:not(:last-child) {
            border-right: 3px solid #333;
        }
        
        /* 旋转按钮 */
        #btn-rotate {
            flex: 0.6;
            font-size: 8vmin;
        }
    </style>
</head>
<!-- 默认直接加上 force-landscape 类，实现打开即横屏 -->
<body class="force-landscape">

<div id="app">
    <!-- 上部显示区 -->
    <div id="display-area">
        <!-- 视图1：时钟 -->
        <div id="view-clock" class="view active">
            <div id="time">00:00</div>
            <div id="date">加载中...</div>
        </div>

        <!-- 视图2：番茄钟 -->
        <div id="view-pomo" class="view">
            <div id="pomo-timer">25:00</div>
            
            <div class="pomo-settings" id="pomo-settings">
                <div class="set-btn" onclick="adjustTime(-5)">-</div>
                <div id="set-mins">25</div>
                <div class="set-btn" onclick="adjustTime(5)">+</div>
            </div>

            <div class="pomo-controls">
                <div class="ctrl-btn" id="btn-start" onclick="togglePomo()">开始</div>
                <div class="ctrl-btn" onclick="resetPomo()">重置</div>
            </div>
        </div>
    </div>

    <!-- 下部导航区 -->
    <div id="nav-area">
        <div class="nav-btn active" id="btn-nav-clock" onclick="switchView('clock')">数字时钟</div>
        <!-- 按钮文字默认改为“竖屏” -->
        <div class="nav-btn" id="btn-rotate" onclick="toggleRotate()">📱 竖屏</div>
        <div class="nav-btn" id="btn-nav-pomo" onclick="switchView('pomo')">番茄钟</div>
    </div>
</div>

<script>
    // --- 旋转屏幕逻辑 ---
    function toggleRotate() {
        var body = document.body;
        var btn = document.getElementById('btn-rotate');
        
        if (body.className === 'force-landscape') {
            // 如果当前是横屏，点击后恢复竖屏
            body.className = '';
            btn.innerHTML = '🔄 横屏';
        } else {
            // 如果当前是竖屏，点击后恢复横屏
            body.className = 'force-landscape';
            btn.innerHTML = '📱 竖屏';
        }
    }

    // --- 视图切换逻辑 ---
    function switchView(viewName) {
        document.getElementById('view-clock').classList.remove('active');
        document.getElementById('view-pomo').classList.remove('active');
        document.getElementById('btn-nav-clock').classList.remove('active');
        document.getElementById('btn-nav-pomo').classList.remove('active');

        if (viewName === 'clock') {
            document.getElementById('view-clock').classList.add('active');
            document.getElementById('btn-nav-clock').classList.add('active');
        } else {
            document.getElementById('view-pomo').classList.add('active');
            document.getElementById('btn-nav-pomo').classList.add('active');
        }
    }

    // --- 时钟逻辑 ---
    function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('time').textContent = h + ':' + m; 

        var year = now.getFullYear();
        var month = String(now.getMonth() + 1).padStart(2, '0');
        var date = String(now.getDate()).padStart(2, '0');
        var weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        document.getElementById('date').textContent = year + '年' + month + '月' + date + '日 星期' + weekDays[now.getDay()];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 番茄钟逻辑 ---
    var pomoTotalSeconds = 25 * 60; 
    var pomoTimeLeft = pomoTotalSeconds;
    var pomoTimer = null;
    var isRunning = false;

    var pomoTimerDisplay = document.getElementById('pomo-timer');
    var settingsArea = document.getElementById('pomo-settings');
    var btnStart = document.getElementById('btn-start');
    var setMinsDisplay = document.getElementById('set-mins');

    function formatPomoTime(seconds) {
        var m = String(Math.floor(seconds / 60)).padStart(2, '0');
        var s = String(seconds % 60).padStart(2, '0');
        return m + ':' + s;
    }

    function updatePomoDisplay() {
        pomoTimerDisplay.textContent = formatPomoTime(pomoTimeLeft);
    }

    function adjustTime(mins) {
        if (isRunning) return; 
        var currentMins = Math.floor(pomoTotalSeconds / 60);
        currentMins += mins;
        if (currentMins < 1) currentMins = 1;
        if (currentMins > 120) currentMins = 120; 

        pomoTotalSeconds = currentMins * 60;
        pomoTimeLeft = pomoTotalSeconds;
        setMinsDisplay.textContent = currentMins;
        updatePomoDisplay();
    }

    function togglePomo() {
        if (isRunning) {
            clearInterval(pomoTimer);
            isRunning = false;
            btnStart.textContent = '继续';
            settingsArea.style.display = 'flex'; 
        } else {
            isRunning = true;
            btnStart.textContent = '暂停';
            settingsArea.style.display = 'none'; 
            
            pomoTimer = setInterval(function() {
                pomoTimeLeft--;
                updatePomoDisplay();

                if (pomoTimeLeft <= 0) {
                    clearInterval(pomoTimer);
                    isRunning = false;
                    btnStart.textContent = '开始';
                    settingsArea.style.display = 'flex';
                    alert('时间到！');
                    pomoTimeLeft = pomoTotalSeconds;
                    updatePomoDisplay();
                }
            }, 1000);
        }
    }

    function resetPomo() {
        clearInterval(pomoTimer);
        isRunning = false;
        btnStart.textContent = '开始';
        settingsArea.style.display = 'flex';
        pomoTimeLeft = pomoTotalSeconds;
        updatePomoDisplay();
    }
    
    updatePomoDisplay();
</script>
</body>
</html>
