<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 极简时钟</title>
    <style>
        /* 墨水屏专属高对比度样式 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 视图容器 */
        .view {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-top: 5vh;
            box-sizing: border-box;
        }
        .view.active {
            display: flex;
        }

        /* --- 主页时钟视图 --- */
        .main-clock-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #time {
            font-size: 32vh; /* 占据屏幕80%的视觉中心 */
            font-weight: bold;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 5vh;
            color: #888888;
            margin-top: 2vh;
        }

        /* --- 番茄钟视图 --- */
        .pomo-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .pomo-status {
            font-size: 4vh;
            margin-bottom: 2vh;
            border: 2px solid #fff;
            padding: 10px 30px;
            border-radius: 10px;
        }

        .pomo-timer {
            font-size: 25vh;
            font-weight: bold;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            margin-bottom: 3vh;
        }

        /* 设置区域 */
        .settings-row {
            display: flex;
            gap: 20px;
            margin-bottom: 3vh;
            font-size: 3vh;
            align-items: center;
        }
        
        .setting-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            font-size: 4vh;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
        }
        .setting-btn:active { background: #fff; color: #000; }

        /* 控制按钮 */
        .pomo-controls {
            display: flex;
            gap: 30px;
        }
        .pomo-controls button {
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            padding: 10px 40px;
            font-size: 4vh;
            border-radius: 10px;
        }
        .pomo-controls button:active { background: #fff; color: #000; }

        /* --- 底部导航栏 --- */
        .bottom-nav {
            width: 100vw;
            height: 12vh;
            display: flex;
            border-top: 2px solid #333;
        }

        .bottom-nav button {
            flex: 1;
            background: #000;
            color: #fff;
            border: none;
            font-size: 5vh;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* 选中的导航高亮 */
        .bottom-nav button.active {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- 视图1：数字时钟主页 -->
    <div id="view-clock" class="view active">
        <div class="main-clock-area">
            <div id="time">00:00:00</div>
            <div id="date">加载中...</div>
        </div>
        <div class="bottom-nav">
            <button id="nav-clock" class="active" onclick="switchView('clock')">数字时钟</button>
            <button id="nav-pomo" onclick="switchView('pomo')">番茄钟</button>
        </div>
    </div>

    <!-- 视图2：番茄钟 -->
    <div id="view-pomo" class="view">
        <div class="pomo-area">
            <div id="pomo-status" class="pomo-status">专注模式</div>
            <div id="pomo-display" class="pomo-timer">25:00</div>
            
            <!-- 设置时间区域（使用加减按钮避免打字） -->
            <div class="settings-row" id="setting-area">
                <span>设置分钟：</span>
                <button class="setting-btn" onclick="adjustTime(-5)">-</button>
                <span id="set-minutes" style="font-size: 5vh; width: 80px; text-align: center;">25</span>
                <button class="setting-btn" onclick="adjustTime(5)">+</button>
            </div>

            <div class="pomo-controls">
                <button id="btn-start" onclick="togglePomo()">开始</button>
                <button onclick="resetPomo()">重置</button>
            </div>
        </div>
        <div class="bottom-nav">
            <button id="nav-clock2" onclick="switchView('clock')">数字时钟</button>
            <button id="nav-pomo2" class="active" onclick="switchView('pomo')">番茄钟</button>
        </div>
    </div>

    <script>
        // --- 页面切换逻辑 ---
        function switchView(viewName) {
            // 隐藏所有视图
            document.getElementById('view-clock').classList.remove('active');
            document.getElementById('view-pomo').classList.remove('active');
            
            // 取消所有导航按钮的高亮
            document.getElementById('nav-clock').classList.remove('active');
            document.getElementById('nav-pomo').classList.remove('active');
            document.getElementById('nav-clock2').classList.remove('active');
            document.getElementById('nav-pomo2').classList.remove('active');

            // 显示目标视图并高亮对应按钮
            if (viewName === 'clock') {
                document.getElementById('view-clock').classList.add('active');
                document.getElementById('nav-clock').classList.add('active');
            } else {
                document.getElementById('view-pomo').classList.add('active');
                document.getElementById('nav-pomo2').classList.add('active');
            }
        }

        // --- 时钟逻辑 ---
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            // 考虑到墨水屏刷新率，主页不显示秒，只显示时和分
            document.getElementById('time').textContent = `${h}:${m}`; 

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('date').textContent = `${year}年${month}月${date}日 星期${weekDays[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 番茄钟逻辑 ---
        let pomoTotalSeconds = 25 * 60; // 默认25分钟
        let pomoTimeLeft = pomoTotalSeconds;
        let pomoTimer = null;
        let isRunning = false;

        const pomoDisplay = document.getElementById('pomo-display');
        const pomoStatus = document.getElementById('pomo-status');
        const settingArea = document.getElementById('setting-area');
        const btnStart = document.getElementById('btn-start');
        const setMinutesSpan = document.getElementById('set-minutes');

        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updatePomoDisplay() {
            pomoDisplay.textContent = formatTime(pomoTimeLeft);
        }

        // 调整时间
        function adjustTime(mins) {
            if (isRunning) return; // 运行中不允许调整
            let currentMins = Math.floor(pomoTotalSeconds / 60);
            currentMins += mins;
            if (currentMins < 1) currentMins = 1;
            if (currentMins > 120) currentMins = 120; // 限制最长120分钟

            pomoTotalSeconds = currentMins * 60;
            pomoTimeLeft = pomoTotalSeconds;
            setMinutesSpan.textContent = currentMins;
            updatePomoDisplay();
        }

        function togglePomo() {
            if (isRunning) {
                // 暂停
                clearInterval(pomoTimer);
                isRunning = false;
                btnStart.textContent = '继续';
                settingArea.style.display = 'flex'; // 暂停时允许修改时间
            } else {
                // 开始
                isRunning = true;
                btnStart.textContent = '暂停';
                settingArea.style.display = 'none'; // 运行时隐藏设置区，防止误触
                
                pomoTimer = setInterval(() => {
                    pomoTimeLeft--;
                    updatePomoDisplay();

                    if (pomoTimeLeft <= 0) {
                        clearInterval(pomoTimer);
                        isRunning = false;
                        btnStart.textContent = '开始';
                        settingArea.style.display = 'flex';
                        pomoStatus.textContent = '时间到！';
                        // Kindle 墨水屏提示
                        alert('时间到！');
                        pomoTimeLeft = pomoTotalSeconds;
                        updatePomoDisplay();
                        pomoStatus.textContent = '专注模式';
                    }
                }, 1000);
            }
        }

        function resetPomo() {
            clearInterval(pomoTimer);
            isRunning = false;
            btnStart.textContent = '开始';
            settingArea.style.display = 'flex';
            pomoTimeLeft = pomoTotalSeconds;
            pomoStatus.textContent = '专注模式';
            updatePomoDisplay();
        }
        
        // 初始化
        updatePomoDisplay();
    </script>
</body>
</html>
